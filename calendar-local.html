<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Calendar (local timezone)</title>
	<style>
		html, body, #calendar-container, iframe {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			border: 0;
		}
		iframe {
			display: block;
		}
	</style>
</head>
<body>
	<div id="calendar-container">
		<iframe src="https://www.google.com/calendar/embed?mode=WEEK&amp;height=600&amp;wkst=1&amp;bgcolor=%23FFFFFF&amp;src=th4019%40gmail.com&amp;color=%2329527A&amp;src=90h6rssknjucrgpf8g2lotnqkg%40group.calendar.google.com&amp;color=%23865A5A&amp;ctz=America%2FDenver" frameborder="0" scrolling="no"></iframe>
	</div>
	<script>
		var timezone = encodeURIComponent(
			Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Denver'
		);
		var height = window.innerHeight;
		var pref = '<iframe src="https://www.google.com/calendar/embed?mode=WEEK&amp;height=' + height + '&amp;wkst=1&amp;bgcolor=%23FFFFFF&amp;src=th4019%40gmail.com&amp;color=%2329527A&amp;src=90h6rssknjucrgpf8g2lotnqkg%40group.calendar.google.com&amp;color=%23865A5A&amp;ctz=';
		var suff = '" frameborder="0" scrolling="no"></iframe>';
		document.getElementById('calendar-container').innerHTML = pref + timezone + suff;
	</script>
</body>
</html>
